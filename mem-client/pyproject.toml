[project]
name = "neko-mem-client"
version = "0.1.0"
description = "Unified HTTP client for the N.E.K.O memory_server (cache/process/renew/settle pipeline + query_memory/new_dialog/health) with body-status enforcement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neko_mem_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
