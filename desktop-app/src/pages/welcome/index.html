<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <!-- 相遇海报：960×640，左 60% 安静文字 + 右下角色，不对称构图（DESIGN.md Layout） -->
  <main class="poster" aria-label="相遇海报">
    <div class="poster-copy">
      <h1 class="poster-title">以后，在这里见。</h1>
      <p class="poster-sub">
        桌面、QQ、微信、你的终端——都是同一个我。<br>
        我大部分时间在睡觉，但你写下什么的时候，我知道。
      </p>
      <a class="hero-btn" href="../settings/index.html">开始设置</a>
    </div>

      由 Live2D 模型接管；引擎加载失败再降级为呼吸圆点（loader 内置）。
      挂载点尺寸/层级约定见 README「桌宠挂载点」。
    -->
    <div class="poster-cat" aria-hidden="true">
      <div id="pet-mount" data-pet-height="170">
        <svg viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg" class="cat">
          <g class="breath">

            <circle cx="141" cy="34" r="5.4" fill="#B5452C"/>
            <g class="face">
              <ellipse class="eye" cx="83" cy="80" rx="4.6" ry="7.4" fill="#3A2C1A"/>
              <ellipse class="eye" cx="117" cy="80" rx="4.6" ry="7.4" fill="#3A2C1A"/>
              <circle cx="84.6" cy="77.4" r="1.5" fill="#C98A2E"/>
              <circle cx="118.6" cy="77.4" r="1.5" fill="#C98A2E"/>
              <path d="M95 94 q 5 3.4 10 0" stroke="#B5452C" stroke-width="2" fill="none" stroke-linecap="round"/>
              <ellipse cx="72" cy="92" rx="5.4" ry="3" fill="#B5452C" opacity=".18"/>
              <ellipse cx="128" cy="92" rx="5.4" ry="3" fill="#B5452C" opacity=".18"/>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>

  <!-- 桌宠渲染栈：与 pet-demo.html 同一套静态分发（script 标签 vite 原样保留，
       与上面的 ESM 模块并行不冲突——loader 对全局 PIXI 幂等） -->
  <script src="/vendor/pixi7.min.js"></script>
  <script src="/vendor/pixi-sound.min.js"></script>
  <script src="/vendor/live2d.min.js"></script>
  <script src="/vendor/cubism2.min.js"></script>
  <script src="/vendor/pet-mount-bundle.js"></script>
</body>
</html>
