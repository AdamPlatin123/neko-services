<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>最小验证 v3 全本地</title></head>
<body style="background:#241E17;margin:0">
<canvas id="stage" style="width:100vw;height:100vh;display:block"></canvas>
<script src="/vendor/pixi7.min.js"></script>
<script src="/vendor/pixi-sound.min.js"></script><script src="/vendor/live2d.min.js"></script>
<script src="/vendor/cubism2.min.js"></script>
<script>
window.__status = 'boot';
(async () => {
  try {
    window.__status = 'pixi:' + (typeof PIXI !== 'undefined') + ' l2d:' + (typeof window.Live2D !== 'undefined') + ' plugin:' + (typeof PIXI.live2d !== 'undefined');
    const app = new PIXI.Application({ view: document.getElementById('stage'),
      transparent: true, width: innerWidth, height: innerHeight, autoStart: true });
    const model = await PIXI.live2d.Live2DModel.from(
      '/models/xiaomai/xiaomai.model.json', { autoInteract: false });
    const cm = model.internalModel.coreModel;
    const mh = cm.getCanvasHeight ? cm.getCanvasHeight() : 1295;
    model.scale.set(220 / mh);
    model.anchor.set(0.5, 1);
    model.position.set(innerWidth / 2, innerHeight * 0.85);
    app.stage.addChild(model);
    window.__model = model;
    window.__status = 'READY';
  } catch (e) { window.__status = 'ERR:' + e.message; console.error(e); }
})();
</script>
</body></html>
