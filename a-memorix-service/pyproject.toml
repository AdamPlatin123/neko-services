[project]
name = "a-memorix-service"
version = "0.1.0"
description = "A_memorix 独立检索服务（P0-1：vendored 上游树 + 注入式宿主桩）"
requires-python = ">=3.12"
# 真实运行依赖清单（P0-1b 补齐并锁版本）：numpy、scipy、faiss-cpu、tomlkit、json-repair、
# sqlalchemy、sqlmodel、pydantic、aiohttp、openai、jieba、psutil、ahocorasick_rs、rich、tenacity。
# 本阶段（P0-1 第一阶段）只做 import 链验证，依赖由 uv venv 手动安装（见 tests/test_import_sweep.py 头注释）。
dependencies = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
