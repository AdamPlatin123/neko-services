<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="100%" height="100%">
  <defs>
    <filter id="seal-bleed" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="3" seed="15" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.75" result="halo" />
      <feGaussianBlur in="displaced" stdDeviation="0.25" result="core" />
      <feMerge>
        <feMergeNode in="halo" />
        <feMergeNode in="core" />
        <feMergeNode in="displaced" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#seal-bleed)" stroke="#B5452C" fill="none">
    <!-- 印章外框：汉印厚边，微带手工刀凿弧度与钝角 -->
    <path d="M 14.5 11 C 26 10.6 68 10.8 81.5 11.2 C 84.2 11.3 85 12.5 85 14.8 C 84.7 28 85.3 68 84.8 81.2 C 84.7 83.8 83.5 85 81.2 84.8 C 68 85.2 28 84.7 14.8 85 C 12.2 85 11 83.8 11.2 81.2 C 10.8 68 11.3 28 11 14.8 C 11 12.2 12.2 11 14.5 11 Z" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 上字「同」：缪篆平正结构 -->
    <!-- 冂：立柱与顶梁 -->
    <path d="M 22 42.5 L 22 23 C 22 21.5 23.5 20.8 25.5 20.8 L 70.5 20.8 C 72.5 20.8 74 21.5 74 23 L 74 42.5" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 中横 -->
    <line x1="32" y1="28.5" x2="64" y2="28.5" stroke-width="3.6" stroke-linecap="round" />
    <!-- 内口 -->
    <rect x="34" y="34.5" width="28" height="8" rx="0.5" stroke-width="3.6" stroke-linejoin="round" />

    <!-- 下字「在」：汉印缪篆布白 -->
    <!-- 顶横 -->
    <line x1="22" y1="49.5" x2="74" y2="49.5" stroke-width="3.8" stroke-linecap="round" />
    <!-- 左竖引下 -->
    <line x1="22" y1="49.5" x2="22" y2="63.5" stroke-width="3.8" stroke-linecap="round" />
    <!-- 中轴主立柱 -->
    <line x1="48" y1="49.5" x2="48" y2="74.5" stroke-width="3.8" stroke-linecap="round" />
    <!-- 中间横画 -->
    <line x1="33" y1="62" x2="67" y2="62" stroke-width="3.6" stroke-linecap="round" />
    <!-- 底托长横 -->
    <line x1="22" y1="74.5" x2="74" y2="74.5" stroke-width="3.8" stroke-linecap="round" />

    <!-- 朱砂印泥自然渗透与纤维洇点 -->
    <circle cx="16.5" cy="17" r="0.9" fill="#B5452C" stroke="none" />
    <circle cx="78.5" cy="18" r="0.7" fill="#B5452C" stroke="none" />
    <circle cx="79.5" cy="77.5" r="1.1" fill="#B5452C" stroke="none" />
    <circle cx="17" cy="78" r="0.8" fill="#B5452C" stroke="none" />
    <circle cx="26" cy="46" r="0.7" fill="#B5452C" stroke="none" />
    <circle cx="70" cy="45.5" r="0.8" fill="#B5452C" stroke="none" />
  </g>
</svg>
